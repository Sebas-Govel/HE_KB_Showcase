<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background-color: #0b0f17; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0e1522"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Grid Background Pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.6"/>
  </pattern>
  <rect width="1200" height="680" fill="url(#grid)" />

  <!-- Header Title -->
  <text x="50" y="50" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="-0.5px">SYSTEM ARCHITECTURE &amp; ANALOG TOPOLOGY</text>
  <text x="50" y="75" fill="#94a3b8" font-size="13" font-mono="true">HE-KEYBOARD REV A (PROD) &amp; REV B (ROADMAP) &#8226; POWER DOMAIN SPECIFICATION</text>
  <line x1="50" y1="92" x2="1150" y2="92" stroke="#1e293b" stroke-width="1.5" />

  <!-- 1. POWER DOMAIN / GATING -->
  <g transform="translate(50, 115)">
    <rect width="240" height="490" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#amberGlow)"/>
    
    <text x="20" y="28" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1px">POWER MANAGEMENT</text>
    <text x="20" y="48" fill="#f8fafc" font-size="15" font-weight="600">Dual-Rail Power Gating</text>
    <text x="20" y="66" fill="#64748b" font-size="10">Native SuperMini LiPo + MOSFETs</text>

    <!-- Sub-block: SuperMini Power Source -->
    <rect x="16" y="78" width="208" height="62" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="96" fill="#38bdf8" font-size="11" font-weight="600">SuperMini nRF52840</text>
    <text x="26" y="112" fill="#94a3b8" font-size="9">Native LiPo Charger (B+/B-)</text>
    <text x="26" y="126" fill="#34d399" font-size="9">Regulated 3.3V Output Rail</text>

    <!-- Sub-block: Rev A LED Power Gating (Active) -->
    <rect x="16" y="148" width="208" height="95" rx="6" fill="#0f172a" stroke="#dc2626" stroke-dasharray="3,3"/>
    <text x="26" y="166" fill="#f87171" font-size="11" font-weight="600">Rev A: LED Power Gating</text>
    <text x="26" y="182" fill="#cbd5e1" font-size="9">AO3401A P-MOSFET (Q1)</text>
    <text x="26" y="196" fill="#94a3b8" font-size="9">Controls 3V3_LED via P0.08</text>
    <text x="26" y="212" fill="#10b981" font-size="9" font-weight="600">Cuts 18-30 mA static idle</text>
    <text x="26" y="226" fill="#64748b" font-size="9">0.00 &#181;A quiescent when OFF</text>

    <!-- Sub-block: Rev A 3V3_A Sensor Rail -->
    <rect x="16" y="251" width="208" height="85" rx="6" fill="#0f172a" stroke="#0284c7" stroke-dasharray="3,3"/>
    <text x="26" y="269" fill="#38bdf8" font-size="11" font-weight="600">Rev A: 3V3_A Sensor Rail</text>
    <text x="26" y="285" fill="#f59e0b" font-size="9">Continuous 30x Hall sensing</text>
    <text x="26" y="300" fill="#cbd5e1" font-size="9">I_load &#8776; 42 mA typ (1.4mA/ea)</text>
    <text x="26" y="316" fill="#94a3b8" font-size="9">~11-12h on 500mAh LiPo</text>

    <!-- Sub-block: Rev B Sensor Strobe (Grant Goal - NOT DESIGNED YET) -->
    <rect x="16" y="344" width="208" height="78" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-dasharray="2,2"/>
    <text x="26" y="362" fill="#c084fc" font-size="11" font-weight="600">Rev B (not designed): Sensor Strobe</text>
    <text x="26" y="378" fill="#cbd5e1" font-size="9">Fast P-MOSFET on 3V3_A</text>
    <text x="26" y="392" fill="#94a3b8" font-size="9">Pulsed 20 &#181;s per scan burst</text>
    <text x="26" y="406" fill="#94a3b8" font-size="9">Target &lt; 1.5 mA avg (objective)</text>

    <!-- Standby Metric Box -->
    <rect x="16" y="430" width="208" height="48" rx="6" fill="#111827" stroke="#374151"/>
    <text x="26" y="446" fill="#94a3b8" font-size="9" font-weight="600">REV B SLEEP &#8226; REV A ACTIVE</text>
    <text x="26" y="464" fill="#34d399" font-size="14" font-weight="700">&lt; 20 &#181;A <tspan fill="#64748b" font-size="10" font-weight="normal">/ 42mA</tspan></text>
  </g>

  <!-- 2. HALL EFFECT SENSOR MATRIX -->
  <g transform="translate(320, 115)">
    <rect width="240" height="490" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#cyanGlow)"/>
    
    <text x="20" y="28" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1px">ANALOG SENSING LAYER</text>
    <text x="20" y="48" fill="#f8fafc" font-size="15" font-weight="600">30x HAL403SO Sensors</text>
    <text x="20" y="66" fill="#64748b" font-size="10">100% Springless Magnetic Matrix</text>

    <!-- Sensor Specs Box -->
    <rect x="16" y="78" width="208" height="145" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="98" fill="#38bdf8" font-size="11" font-weight="600">Sensor Specs (per key)</text>
    <text x="26" y="118" fill="#cbd5e1" font-size="10">&#8226; I_DD: <tspan fill="#34d399" font-weight="700">1.4 mA</tspan> (vs 6mA SS49E)</text>
    <text x="26" y="136" fill="#cbd5e1" font-size="10">&#8226; Sensitivity: <tspan fill="#f8fafc">4.1 mV/G</tspan> @ 3.3V</text>
    <text x="26" y="154" fill="#cbd5e1" font-size="10">&#8226; Output Imp: <tspan fill="#f8fafc">R_out = 10 k&#937;</tspan></text>
    <text x="26" y="172" fill="#cbd5e1" font-size="10">&#8226; Linear Range: <tspan fill="#f8fafc">&#177;390 Gauss</tspan></text>
    <text x="26" y="190" fill="#cbd5e1" font-size="10">&#8226; Bypass Cap: <tspan fill="#38bdf8">100 nF &#8804; 2mm</tspan></text>
    <text x="26" y="208" fill="#64748b" font-size="9">SOT-23-3 on B.Cu (bottom)</text>

    <!-- Switch Mechanics Box -->
    <rect x="16" y="231" width="208" height="140" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="251" fill="#a78bfa" font-size="11" font-weight="600">FloatForce Switch V5.0</text>
    <text x="26" y="271" fill="#cbd5e1" font-size="10">&#8226; Stroke: <tspan fill="#a78bfa" font-weight="700">2.36 mm</tspan> (+33%)</text>
    <text x="26" y="289" fill="#cbd5e1" font-size="10">&#8226; Levitation: 3 Neodymium array</text>
    <text x="26" y="307" fill="#cbd5e1" font-size="10">&#8226; Magnetic Barriers: 0.45 mm</text>
    <text x="26" y="325" fill="#cbd5e1" font-size="10">&#8226; Force Profile: Progressive non-linear</text>
    <text x="26" y="343" fill="#cbd5e1" font-size="10">&#8226; Zero metal spring fatigue</text>
    <text x="26" y="361" fill="#64748b" font-size="9">0.000 mm&#179; kinematic interference</text>

    <!-- Signal Lines -->
    <rect x="16" y="380" width="208" height="65" rx="6" fill="#111827" stroke="#374151"/>
    <text x="26" y="400" fill="#94a3b8" font-size="9" font-weight="600">ANALOG CHANNELS</text>
    <text x="26" y="418" fill="#38bdf8" font-size="12" font-weight="700">30 Analog Lines</text>
    <text x="26" y="434" fill="#64748b" font-size="9">To 4x 8:1 MUX banks (bottom bay)</text>
  </g>

  <!-- 3. ANALOG MULTIPLEXER STAGE -->
  <g transform="translate(590, 115)">
    <rect width="240" height="490" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#purpleGlow)"/>
    
    <text x="20" y="28" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1px">SIGNAL ROUTING</text>
    <text x="20" y="48" fill="#f8fafc" font-size="15" font-weight="600">4x TMUX1308PWR</text>
    <text x="20" y="66" fill="#64748b" font-size="10">Dual 16:1 Partitioned Topology</text>

    <!-- MUX Performance Box -->
    <rect x="16" y="78" width="208" height="145" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="98" fill="#c084fc" font-size="11" font-weight="600">Switch Characteristics</text>
    <text x="26" y="118" fill="#cbd5e1" font-size="10">&#8226; R_on: <tspan fill="#34d399" font-weight="700">59 &#937;</tspan> typ (120&#937; @ 3.3V)</text>
    <text x="26" y="136" fill="#cbd5e1" font-size="10">&#8226; Switch Capacitance: <tspan fill="#f8fafc">9-11 pF</tspan></text>
    <text x="26" y="154" fill="#cbd5e1" font-size="10">&#8226; Transition Speed: <tspan fill="#f8fafc">t_pd ~ 40 ns</tspan></text>
    <text x="26" y="172" fill="#cbd5e1" font-size="10">&#8226; Address Bus: <tspan fill="#c084fc">A0, A1, A2</tspan></text>
    <text x="26" y="190" fill="#cbd5e1" font-size="10">&#8226; Enable: Active-Low EN0..EN3</text>
    <text x="26" y="208" fill="#64748b" font-size="9">High-Z state when unselected</text>

    <!-- Split SAADC Return Paths -->
    <rect x="16" y="231" width="208" height="140" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-dasharray="3,3"/>
    <text x="26" y="251" fill="#c084fc" font-size="11" font-weight="600">Split ADC Output Bus</text>
    <text x="26" y="271" fill="#cbd5e1" font-size="10">&#8226; Bank A (U1+U2): 16 keys</text>
    <text x="26" y="287" fill="#38bdf8" font-size="9">&#8594; MUX_OUT &#8594; AIN7 (P0.31)</text>
    <text x="26" y="307" fill="#cbd5e1" font-size="10">&#8226; Bank B (U3+U4): 14 keys + 2 GND</text>
    <text x="26" y="323" fill="#38bdf8" font-size="9">&#8594; MUX_OUT_B &#8594; AIN5 (P0.29)</text>
    <text x="26" y="345" fill="#34d399" font-size="9" font-weight="600">&#8226; 34% line capacitance reduction</text>
    <text x="26" y="361" fill="#64748b" font-size="9">160 pF down to ~80 pF</text>

    <!-- Zero calibration channels -->
    <rect x="16" y="380" width="208" height="65" rx="6" fill="#111827" stroke="#374151"/>
    <text x="26" y="400" fill="#94a3b8" font-size="9" font-weight="600">HARDWARE REFERENCE</text>
    <text x="26" y="418" fill="#f8fafc" font-size="11" font-weight="600">2x Hard-GND Channels</text>
    <text x="26" y="434" fill="#64748b" font-size="9">Real-time noise floor / offset nulling</text>
  </g>

  <!-- 4. PROCESSING & CONNECTIVITY -->
  <g transform="translate(860, 115)">
    <rect width="290" height="490" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#greenGlow)"/>
    
    <text x="20" y="28" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1px">COMPUTE &amp; FIRMWARE</text>
    <text x="20" y="48" fill="#f8fafc" font-size="15" font-weight="600">SuperMini nRF52840</text>
    <text x="20" y="66" fill="#64748b" font-size="10">ARM Cortex-M4F @ 64 MHz &#8226; Zephyr RTOS</text>

    <!-- ADC & DSP Box -->
    <rect x="16" y="78" width="258" height="145" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="98" fill="#34d399" font-size="11" font-weight="600">12-bit SAADC Engine</text>
    <text x="26" y="118" fill="#cbd5e1" font-size="10">&#8226; Ratiometric VDD/4 reference</text>
    <text x="26" y="136" fill="#cbd5e1" font-size="10">&#8226; Cancels 3.3V power supply ripple</text>
    <text x="26" y="154" fill="#cbd5e1" font-size="10">&#8226; Settling Time: <tspan fill="#38bdf8">50 &#181;s</tspan> per channel</text>
    <text x="26" y="172" fill="#cbd5e1" font-size="10">&#8226; Moving Average: <tspan fill="#34d399">4-sample filter</tspan></text>
    <text x="26" y="190" fill="#cbd5e1" font-size="10">&#8226; Noise Floor: <tspan fill="#34d399">&lt; &#177;8 mV</tspan> (&lt;10 counts)</text>
    <text x="26" y="208" fill="#64748b" font-size="9">Cyclic sequential scan synchronization</text>

    <!-- Key Features & Rapid Trigger -->
    <rect x="16" y="231" width="258" height="140" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="251" fill="#38bdf8" font-size="11" font-weight="600">Firmware Algorithms</text>
    <text x="26" y="271" fill="#cbd5e1" font-size="10">&#8226; Dynamic Rapid Trigger (sub-0.1mm)</text>
    <text x="26" y="289" fill="#cbd5e1" font-size="10">&#8226; Per-key independent actuation points</text>
    <text x="26" y="307" fill="#cbd5e1" font-size="10">&#8226; HID Safe Boot Mode (0 phantom taps)</text>
    <text x="26" y="325" fill="#cbd5e1" font-size="10">&#8226; Ambidextrous software side mapping</text>
    <text x="26" y="343" fill="#cbd5e1" font-size="10">&#8226; Non-Volatile Flash Config (NVS)</text>
    <text x="26" y="361" fill="#64748b" font-size="9">Web Serial calibration at 15 Hz</text>

    <!-- Transports & Roadmap -->
    <rect x="16" y="380" width="258" height="65" rx="6" fill="#111827" stroke="#374151"/>
    <text x="26" y="398" fill="#94a3b8" font-size="9" font-weight="600">TRANSPORTS &amp; MONITORING</text>
    <text x="26" y="416" fill="#f8fafc" font-size="11" font-weight="600">Bluetooth LE 5.3 &#8226; USB HID</text>
    <text x="26" y="432" fill="#38bdf8" font-size="9">Rev B (not designed): Slide Switch + V_BAT Div (AIN2)</text>
  </g>

  <!-- CONNECTING ARROWS & LABELS -->
  <path d="M 290 280 L 320 280" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="305" cy="280" r="3" fill="#38bdf8"/>
  <text x="293" y="270" fill="#38bdf8" font-size="9" font-weight="600">3V3_A</text>

  <path d="M 560 360 L 590 360" stroke="#c084fc" stroke-width="2.5" />
  <circle cx="575" cy="360" r="3" fill="#c084fc"/>
  <text x="563" y="350" fill="#c084fc" font-size="9" font-weight="600">30x OUT</text>

  <path d="M 830 320 L 860 320" stroke="#34d399" stroke-width="2.5" />
  <path d="M 830 380 L 860 380" stroke="#38bdf8" stroke-width="2.5" />
  <text x="833" y="312" fill="#34d399" font-size="9" font-weight="600">AIN7</text>
  <text x="833" y="372" fill="#38bdf8" font-size="9" font-weight="600">AIN5</text>

  <path d="M 860 480 L 590 480" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="680" y="472" fill="#94a3b8" font-size="9">Address Bus (A0..A2) + EN0..EN3</text>
  <path d="M 860 520 L 290 520" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="420" y="512" fill="#f87171" font-size="9">Power Gating Control (LED_EN = P0.08)</text>

  <!-- Footer Tag -->
  <text x="50" y="645" fill="#475569" font-size="11">1517 Fund &#8226; Medici Project Pitch Documentation &#8226; Rev A (Fabrication) &amp; Rev B Direction</text>
  <text x="1080" y="645" fill="#475569" font-size="11" text-anchor="end">Open-Source Engineering Spec</text>
</svg>